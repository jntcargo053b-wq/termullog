name: termullog
description: Aplikasi dokumentasi dengan GPS watermark
publish_to: 'none'

version: 1.0.0+1

# ============================================================
# SDK CONSTRAINT (WAJIB)
# ============================================================
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

# ============================================================
# DEPENDENCIES
# ============================================================
dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # Camera & Gallery
  camera: ^0.10.5
  gallery_saver_plus: ^3.2.9
  share_plus: ^9.0.0
  
  # Location & Maps
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  flutter_map: ^6.1.0
  
  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.2
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Image Processing - Versi 3.3.0 (tanpa embedded fonts)
  # PERHATIAN: Versi ini memerlukan loading font eksternal
  image: 3.3.0
  
  # HTTP & Networking
  http: ^1.2.0
  
  # Other - Menggunakan versi stabil untuk kompatibilitas
  flutter_svg: ^1.0.3

# ============================================================
# DEV DEPENDENCIES
# ============================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ============================================================
# FLUTTER CONFIG
# ============================================================
flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
    - assets/fonts/  # Tambahkan folder fonts untuk file .ttf
  
  # FONT: Untuk image 3.3.0, Anda perlu menambahkan file font eksternal
  # Download Arial.ttf dan tempatkan di assets/fonts/
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial.ttf
        - asset: assets/fonts/Arial-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
