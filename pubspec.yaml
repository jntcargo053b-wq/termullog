name: termullog

description: TermulLog Premium Delivery App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # CAMERA & GALLERY
  image_picker: ^1.1.2

  # LOCATION
  geolocator: ^11.1.0
  geocoding: ^3.0.0

  # STORAGE
  path_provider: ^2.1.3
  shared_preferences: ^2.2.2

  # IMAGE PROCESSING
  image: ^4.2.0

  # NETWORK
  http: ^1.2.1

  # DATE FORMAT
  intl: ^0.19.0

  # SAVE TO GALLERY
  gallery_saver_plus: ^3.2.0

  # SHARE IMAGE
  share_plus: ^9.0.0

  # SIGNATURE PAD
  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
