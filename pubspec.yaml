name: termullog

description: TermulLog Premium Delivery App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  camera: ^0.11.0+2
  image_picker: ^1.1.2

  geolocator: ^13.0.0
  geocoding: ^3.0.0

  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  image: ^4.2.0

  http: ^1.2.1

  intl: ^0.19.0

  gallery_saver_plus: ^3.2.1

  share_plus: ^12.0.2

  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

dependency_overrides:
  geolocator_android: ^5.0.0
  geolocator_web: ^4.1.0
  geolocator_platform_interface: ^4.2.0
