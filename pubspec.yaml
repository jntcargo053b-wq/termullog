name: termullog
description: TermulLog Premium Delivery App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  signature: ^5.5.0
  # ... lain-lain
  # Camera
  camera: ^0.10.5+9
  camera_android_camerax: ^0.6.5+1
  device_info_plus: ^9.1.0   # tambahkan ini
  
  # Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  path: ^1.9.0

  # Image processing
  image: ^4.8.0

  # Date time
  intl: ^0.19.0

  # GPS & Address
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  geolocator_android: ^4.6.1  # 🔑 Versi yang kompatibel dengan geolocator ^11.0.0

  # Save & share
  gallery_saver_plus: ^3.2.1
  share_plus: ^9.0.0
  
  # Signature
  signature: ^5.5.0

  # HTTP client
  http: ^1.2.0

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Permission handler (Android 13+)
  permission_handler: ^11.3.1

  # Async utilities
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  camera_android_camerax: 0.6.5+1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
