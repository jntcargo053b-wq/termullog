name: termullog
description: TermulLog – GPS Camera App (Proof of Delivery Edition)
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera
  camera: ^0.10.5+9
  camera_android_camerax: ^0.6.5+1
  device_info_plus: ^9.1.0

  # Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  path: ^1.9.0

  # Image processing
  image: ^4.2.0

  # Date & locale
  intl: ^0.19.0

  # GPS & Geocoding
  geolocator: ^11.0.0
  geolocator_android: ^4.6.1
  geocoding: ^2.1.1

  # Save & share
  gallery_saver_plus: ^3.2.1
  share_plus: ^9.0.0

  # HTTP client (weather + map tiles + geocode)
  http: ^1.2.0

  # Permission handler (Android 13+)
  permission_handler: ^11.3.1

  # Additional dependencies untuk POD
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  camera_android_camerax: 0.6.5+1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/fonts/
