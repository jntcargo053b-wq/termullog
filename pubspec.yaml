name: termullog
description: Aplikasi dokumentasi dengan GPS watermark
publish_to: 'none'

version: 1.0.0+1

# ============================================================
# SDK CONSTRAINT (WAJIB)
# ============================================================
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

# ============================================================
# DEPENDENCIES
# ============================================================
dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # Camera & Gallery
  camera: ^0.10.5
  gallery_saver_plus: ^3.2.9
  share_plus: ^9.0.0
  
  # Location & Maps
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  flutter_map: ^6.1.0
  
  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.2
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Image Processing - Versi 3.0.5 dengan embedded fonts (arial_14, arial_24, dll)
  image: 3.0.5
  
  # HTTP & Networking
  http: ^1.2.0
  
  # Other
  flutter_svg: ^2.0.9

# ============================================================
# DEV DEPENDENCIES
# ============================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ============================================================
# FLUTTER CONFIG
# ============================================================
flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
  
  # CATATAN: File font tidak disertakan dalam repositori.
  # Tambahkan font ke folder assets/fonts/ secara manual jika diperlukan:
  #
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
  #   - family: Caveat
  #     fonts:
  #       - asset: assets/fonts/Caveat-Regular.ttf
  #   - family: BebasNeue
  #     fonts:
  #       - asset: assets/fonts/BebasNeue-Regular.ttf
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: RobotoMono
  #     fonts:
  #       - asset: assets/fonts/RobotoMono-Regular.ttf
