name: termullog
description: Aplikasi dokumentasi dengan GPS watermark
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # Camera & Gallery
  camera: ^0.10.5
  gallery_saver_plus: ^3.2.9
  image_picker: ^1.0.5
  share_plus: ^9.0.0
  
  # Location & Maps
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  flutter_map: ^6.1.0
  
  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.2
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Image Processing
  image: ^4.1.7
  
  # HTTP
  http: ^1.2.0
  
  # Other
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
