name: termullog
description: Aplikasi dokumentasi dengan GPS watermark
publish_to: 'none'

version: 1.0.0+1

# ============================================================
# SDK CONSTRAINT (WAJIB)
# ============================================================
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

# ============================================================
# DEPENDENCIES
# ============================================================
dependencies:
  flutter:
    sdk: flutter
  
  # UI & Core
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # Camera & Gallery
  camera: ^0.10.5
  gallery_saver_plus: ^3.2.9
  share_plus: ^9.0.0
  
  # Location & Maps
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  flutter_map: ^6.1.0
  
  # Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.2
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Image Processing - VERSI STABLE DENGAN EMBEDDED FONTS
  # Menggunakan 3.0.5 karena memiliki arial_12, arial_14, arial_24, arial_36
  # TIDAK perlu download font eksternal atau refactor kode
  image: 3.0.5
  
  # HTTP & Networking
  http: ^1.2.0
  
  # Other - Versi stabil untuk kompatibilitas maksimal
  flutter_svg: ^1.1.6

# ============================================================
# DEV DEPENDENCIES
# ============================================================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ============================================================
# FLUTTER CONFIG
# ============================================================
flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/icons/
  
  # ==========================================================
  # CATATAN PENTING:
  # ==========================================================
  # Dengan image: 3.0.5, Anda TIDAK PERLU menambahkan font apapun
  # karena font Arial sudah built-in di package image.
  #
  # Font berikut tersedia secara otomatis:
  # - img.arial12
  # - img.arial14
  # - img.arial24
  # - img.arial36
  #
  # Kode Anda yang mengimport:
  # import 'package:image/src/font/arial_12.dart';
  # akan berfungsi tanpa error.
  # ==========================================================
  
  # Jika suatu saat ingin menambahkan font kustom, gunakan konfigurasi di bawah:
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
  #   - family: Caveat
  #     fonts:
  #       - asset: assets/fonts/Caveat-Regular.ttf
  #   - family: BebasNeue
  #     fonts:
  #       - asset: assets/fonts/BebasNeue-Regular.ttf
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: RobotoMono
  #     fonts:
  #       - asset: assets/fonts/RobotoMono-Regular.ttf
  #       - asset: assets/fonts/RobotoMono-Bold.ttf
  #         weight: 700
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
